<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>WebCurrate</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div id="main_div", class="column">
      <div class="form">
          <label for="amount">Amount:</label>
          <input id="amount_in" type="text">

      <button id="process_btn">Convert</button>
      <p id="result_p">result: 0</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
